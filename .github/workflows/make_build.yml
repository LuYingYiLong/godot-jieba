name: Build Godot-Jieba Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, for example v1.0.1.
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      asset: ${{ steps.meta.outputs.asset }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      tag_exists: ${{ steps.meta.outputs.tag_exists }}
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')"
          else
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ] || ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "::error::Release tags must start with 'v' and use only letters, digits, '.', '_' or '-'."
            exit 1
          fi
          asset="godot-jieba-$tag.zip"
          {
            echo "tag=$tag"
            echo "asset=$asset"
          } >> "$GITHUB_OUTPUT"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "checkout_ref=$tag" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "checkout_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Pushed tag $tag could not be resolved."
            exit 1
          fi
          echo "tag=$tag asset=$asset"

  build:
    name: ${{ matrix.target.platform }} / ${{ matrix.target.arch }} / ${{ matrix.target-type }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm },
            { platform: windows, arch: x86_64, os: windows-latest },
            { platform: windows, arch: x86_32, os: windows-latest },
            { platform: macos, arch: universal, os: macos-latest },
            { platform: macos, arch: arm64, os: macos-latest },
            { platform: ios, arch: arm64, os: macos-latest },
            { platform: android, arch: x86_64, os: ubuntu-22.04 },
            { platform: android, arch: x86_32, os: ubuntu-22.04 },
            { platform: android, arch: arm64, os: ubuntu-22.04 },
            { platform: android, arch: arm32, os: ubuntu-22.04 },
            { platform: web, arch: wasm32, os: ubuntu-22.04 },
          ]
        target-type: [template_debug, template_release]
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Build Godot-Jieba
        uses: ./.github/actions/build-extension
        with:
          platform: ${{ matrix.target.platform }}
          arch: ${{ matrix.target.arch }}
          target: ${{ matrix.target-type }}

      - name: Stage target library
        shell: bash
        run: >-
          python scripts/package_addon.py stage artifact
          ${{ matrix.target.platform }} ${{ matrix.target.arch }} ${{ matrix.target-type }}

      - name: Stage dictionary assets
        if: matrix.target.platform == 'windows' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug'
        shell: bash
        run: >-
          python scripts/package_addon.py stage artifact
          ${{ matrix.target.platform }} ${{ matrix.target.arch }} ${{ matrix.target-type }}
          --include-addon-data

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-jieba-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          if-no-files-found: error
          path: artifact/

  package:
    name: Verify and package addon
    runs-on: ubuntu-22.04
    needs: [prepare, build]
    env:
      ASSET: ${{ needs.prepare.outputs.asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: godot-jieba-*
          merge-multiple: true
          path: artifact/

      - name: Verify and assemble addon
        run: python3 scripts/package_addon.py assemble artifact

      - name: Create and verify release archive
        run: python3 scripts/package_addon.py archive artifact "release/$ASSET"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-jieba-release
          if-no-files-found: error
          path: release/${{ needs.prepare.outputs.asset }}

  release:
    name: Publish GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified release archive
        uses: actions/download-artifact@v4
        with:
          name: godot-jieba-release
          path: release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ needs.prepare.outputs.asset }}
          TAG_EXISTS: ${{ needs.prepare.outputs.tag_exists }}
        run: |
          set -euo pipefail
          args=("$TAG" "release/$ASSET" --repo "$GITHUB_REPOSITORY" --generate-notes)
          if [ "$TAG_EXISTS" = "true" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
